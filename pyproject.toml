[project]
name = "fuera-de-mi-cabeza"
version = "0.7.0"
description = "Personal Editorial Agent para Substack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.2",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.0",
    "google-api-python-client>=2.149.0",
    "google-auth>=2.35.0",
    "markdown>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["app"]

